# SPDX-License-Identifier: Apache-2.0
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell scripts
        run: shellcheck -s sh tools/*.sh
      - name: XML
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils; }
          xmllint --noout default.xml aosp.xml android-6.0.xml aosp-6.0.xml
      - name: Manifest against AOSP's android-4.4.4_r2.0.1 manifest
        run: |
          curl -fsSL --retry 3 \
            "https://android.googlesource.com/platform/manifest/+/refs/tags/android-4.4.4_r2.0.1/default.xml?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/upstream.xml"
          python3 tools/check_manifest.py --upstream "$RUNNER_TEMP/upstream.xml"
      - name: Manifest against AOSP's android-6.0.1_r81 manifest
        run: |
          curl -fsSL --retry 3 \
            "https://android.googlesource.com/platform/manifest/+/refs/tags/android-6.0.1_r81/default.xml?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/upstream-6.0.xml"
          python3 tools/check_manifest.py --android 6.0 --upstream "$RUNNER_TEMP/upstream-6.0.xml"
